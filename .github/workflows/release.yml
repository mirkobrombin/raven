name: Release

on:
  push:
    tags: ["v*"]
  # The nightly build: main as it is each night, published as the nightly pre-release, when main moved since the last one.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v0.1.0, or nightly for main as it is now
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || (github.event_name == 'schedule' && 'nightly') || github.ref_name }}
  cancel-in-progress: false

env:
  COMPONENTS: /opt/ci/components
  BUILD: /opt/ci/build
  ARCHIVES: /opt/ci/archives
  TAG: ${{ inputs.tag || (github.event_name == 'schedule' && 'nightly') || github.ref_name }}

jobs:
  # Revision: the commit every later job checks out, so a nightly build stays on one commit even when main moves meanwhile.
  # A scheduled night with no new commit on main since the published nightly builds nothing.

  revision:
    name: Resolve the revision
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          build=true
          if [ "${TAG}" = nightly ]; then
            sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
            published=$(gh api "repos/${GH_REPO}/commits/nightly" --jq .sha 2>/dev/null || true)
            if [ "${EVENT}" = schedule ] && [ "${sha}" = "${published}" ]; then
              build=false
            fi
          else
            sha=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "${TAG}: ${sha}, build ${build}"

  # Provision: every component the complete suite builds with, afresh instead of from the trimmed CI caches. Those the
  # release ships under terms that ask for their source come with it (docs/packaging.md).

  provision:
    name: Provision ${{ matrix.component }}
    needs: revision
    if: needs.revision.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    container:
      image: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: rtl
            arguments: --output
            recipe: scripts/provision-rtl.py
          - component: controls
            arguments: --arch x64 --output
            recipe: scripts/provision-controls.py
          - component: controls32
            arguments: --arch x86 --output
            recipe: scripts/provision-controls.py
          - component: installer
            arguments: --arch x64 --output
            recipe: scripts/provision-installer.py
          - component: installer32
            arguments: --arch x86 --output
            recipe: scripts/provision-installer.py
          - component: sqlite
            arguments: --output
            recipe: scripts/provision-sqlite.py
          - component: graphics
            arguments: --destination
            recipe: scripts/provision-graphics.py
          - component: roots
            arguments: --output
            recipe: scripts/provision-roots.py
          - component: libpng
            arguments: --output
            recipe: scripts/provision-libpng.py
          - component: text
            arguments: --jobs 4 --output
            recipe: scripts/provision-text.py
          - component: testdata
            arguments: --output
            recipe: scripts/provision-fixtures.py
    env:
      COMPONENT: ${{ matrix.component }}
      RECIPE: ${{ matrix.recipe }}
      ARGUMENTS: ${{ matrix.arguments }}
      TARGET: /opt/ci/components/${{ matrix.component }}
    steps:
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False git python3
          git config --global --add safe.directory "*"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false

      - name: Install build packages
        run: .github/scripts/install-fedora.sh build

      - name: Provision ${{ matrix.component }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra arguments <<< "${ARGUMENTS}"
          python3 "${RECIPE}" "${arguments[@]}" "${TARGET}"

      - name: Pack component
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ARCHIVES}"
          tar -C "${COMPONENTS}" -cf - "${COMPONENT}" | zstd -T0 -3 -q -o "${ARCHIVES}/${COMPONENT}.tar.zst"

      - name: Upload component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-${{ matrix.component }}
          path: /opt/ci/archives/${{ matrix.component }}.tar.zst
          retention-days: 7
          if-no-files-found: error

  # Build and test: docs/packaging.md as written, on one machine, because the seal and the bundle check the very tree the
  # complete suite ran against.

  package:
    name: Build, test and bundle
    needs: [revision, provision]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    container:
      image: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
      # The host root is mounted only to delete the runner's preinstalled SDKs: a RelWithDebInfo tree and its test
      # prefixes need more disk than the runner leaves free.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined --shm-size 2g -v /:/host
    env:
      XDG_RUNTIME_DIR: /run/ci-runtime
    steps:
      - name: Free disk space
        run: |
          rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc /host/opt/hostedtoolcache
          df -h /

      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False git python3
          git config --global --add safe.directory "*"

      # package-native.py records the exact source revision, so the full history and the tag are needed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install test packages
        run: .github/scripts/install-fedora.sh test

      - name: Download components
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: component-*
          path: /opt/ci/archives
          merge-multiple: true

      - name: Unpack components
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/components.sh unpack
          install -d -m 0700 "${XDG_RUNTIME_DIR}"

      - name: List source materials
        run: python3 .github/scripts/release_materials.py "${COMPONENTS}" /opt/ci/materials.json

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t options < <(.github/scripts/components.sh options)
          cmake -S . -B "${BUILD}" -DCMAKE_BUILD_TYPE=RelWithDebInfo "${options[@]}"

      - name: Prepare
        run: python3 scripts/package-native.py prepare --source "${GITHUB_WORKSPACE}" --build "${BUILD}"

      - name: Build
        run: cmake --build "${BUILD}" -j "$(nproc)"

      - name: Seal
        run: python3 scripts/package-native.py seal --source "${GITHUB_WORKSPACE}" --build "${BUILD}"

      - name: Run the complete suite
        run: >
          ctest --test-dir "${BUILD}" --output-on-failure -j1 --timeout 1800
          --output-junit "${BUILD}/ctest-results.xml"

      # package-native.py refuses to write inside the source tree it packages.
      - name: Bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/ci/dist
          python3 scripts/package-native.py bundle \
            --source "${GITHUB_WORKSPACE}" --build "${BUILD}" \
            --test-report "${BUILD}/ctest-results.xml" \
            --materials /opt/ci/materials.json \
            --output "/opt/ci/dist/raven-${TAG}-linux-x86_64.tar.gz" \
            --source-output "/opt/ci/dist/raven-${TAG}-source.tar.gz"
          (cd /opt/ci/dist && sha256sum ./*.tar.gz > SHA256SUMS)
          cat /opt/ci/dist/SHA256SUMS

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: /opt/ci/dist/
          retention-days: 30
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tests
          path: |
            /opt/ci/build/ctest-results.xml
            /opt/ci/build/Testing/Temporary/LastTest.log
          retention-days: 30
          if-no-files-found: warn

  # Publish: a tag becomes a draft, so a maintainer reads the notes and publishes it by hand. The nightly build replaces the
  # previous nightly pre-release at once, tag included, so its link always gives the newest build that passed the suite.

  publish:
    name: Publish release
    needs: [revision, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release and its assets
      id-token: write # signing the provenance attestation
      attestations: write # storing the provenance attestation
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Replace the nightly pre-release
        if: env.TAG == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          notes="Built from main at ${SHA} on $(date -u +%Y-%m-%d), after the complete test suite passed on it. "
          notes+="This pre-release is replaced by the next night's build whenever main has changed."
          gh release create nightly dist/* --prerelease --latest=false --target "${SHA}" --title "Nightly ${SHA:0:7}" --notes "${notes}"

      - name: Create the draft
        if: env.TAG != 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists; delete the draft first to rebuild it"
            exit 1
          fi
          gh release create "${TAG}" dist/* --draft --verify-tag --title "${TAG}" --generate-notes
